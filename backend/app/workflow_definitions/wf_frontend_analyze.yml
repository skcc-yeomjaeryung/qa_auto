# =============================================================================
# Frontend Analyze Workflow
# -----------------------------------------------------------------------------
# 교보재: docs/05.템플릿/few-shot/template_workflow.yml
# Graph 관련 필드(그래프, 노드, 엣지)는 넣지 않는다.
# Skill/Agent ID를 직접 고정하지 않는다 — capability만 선언.
# =============================================================================

workflow_id: wf_frontend_analyze
version: 1.0.0
name: Frontend 정적 분석 Workflow
description: >
  Phase 01에서 pin된 Frontend workspace를 정적 분석하여
  화면·이벤트·API·Route·Playwright Evidence 구조화 산출물을 만든다.
  AI는 분석 재료만 제공하고, 최종 Pass/Fail·배포는 사람이 결정한다.

workflow_type: code_analysis
domain: test_automation
owner: qa_auto_platform
status: active

decision_boundary:
  ai_role: static_analysis_draft_and_observation
  human_role: final_pass_fail_and_approval
  prohibited_ai_actions:
    - auto_deploy
    - final_pass_fail_decision
    - invent_hub_assets
    - invent_endpoints_without_evidence

trigger_intents:
  - intent_id: analyze_frontend
    aliases:
      - 프론트엔드 분석
      - FE 분석
      - frontend analyze

business_goal:
  - Frontend 화면·컴포넌트·이벤트·API·Route를 근거와 함께 추출한다
  - 해석 실패는 unresolved로 남긴다

input_contract:
  required:
    workspacePath: string
  optional:
    commitSha: string
    projectId: string
    analysisId: string
    artifactPath: string
    progressPath: string
    fileTotal: integer

required_capabilities:
  - capability_id: QA.CODE.FRONTEND_ANALYZE

logical_steps:
  - step_id: step_01
    name: Frontend AST 분석
    required_capability: QA.CODE.FRONTEND_ANALYZE
    depends_on: []

execution_policy:
  execution_pattern: plan_execute_review_reduce
  require_reviewer: true
  require_reducer: true
  allow_parallel_steps: false

output_contract:
  required:
    - frontend_analysis_result
