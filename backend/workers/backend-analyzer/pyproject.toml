[project]
name = "ai-test-backend-analyzer"
version = "0.1.0"
description = "Spring Backend static analysis via Python Skill/Tool (D-010)"
requires-python = ">=3.12"
dependencies = [
  "javalang>=0.13.0",
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ai-test-be-analyze = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
