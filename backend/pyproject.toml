[project]
name = "qa-auto-backend"
version = "0.1.0"
description = "QA_AUTO Code-to-E2E platform backend (SDD D-012)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "truststore>=0.10",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pillow>=12.3.0",
  "faiss-cpu>=1.12.0",
  "numpy>=2.0",
  "keyring>=25.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
